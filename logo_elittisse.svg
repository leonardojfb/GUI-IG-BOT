<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#E5C77E"/>
      <stop offset="50%"  stop-color="#C9A97A"/>
      <stop offset="100%" stop-color="#9C7E48"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#9C7E48" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#D4AF6A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#9C7E48" stop-opacity="0"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="600" height="180" rx="14" fill="#0a0a12"/>

  <!-- ── Wordmark (centered, generous tracking) ── -->
  <text x="300" y="103" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="50" font-weight="700"
        letter-spacing="9"
        filter="url(#goldGlow)">
    <tspan fill="#f4f4f6">ELIT</tspan><tspan fill="url(#goldGrad)">TISSE</tspan>
  </text>

  <!-- ── Single fading gold underline ── -->
  <line x1="240" y1="128" x2="360" y2="128"
        stroke="url(#goldLine)" stroke-width="1"/>
</svg>
